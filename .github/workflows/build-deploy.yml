name: Deploy Prod

on:
  workflow_run:
    workflows: ["Build and Deploy"]   # 👈 listens for completion of your build workflow
    types:
      - completed

permissions:
  contents: read
  actions: read   # 👈 required to download artifacts from another workflow run

jobs:
  prod:
    name: Deploy Prod
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'   # 👈 only run if build succeeded
    environment: prod   # 👈 adds approval gate if you configure "prod" environment in repo settings
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: octomatch
          path: website
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Production
        run: |
          echo "Downloaded artifact contents:"
          tree website
          echo "Demo deploy step: replace with your real deploy command."
